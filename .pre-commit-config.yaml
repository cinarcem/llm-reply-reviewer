repos:
  - repo: https://github.com/gitleaks/gitleaks
    # Keep in sync with GITLEAKS_VERSION in .github/workflows/ci.yml.
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: uv-lock
        name: Uv lock
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff-check
        name: Ruff check
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi, jupyter]

      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi, jupyter, markdown]

      - id: mypy
        name: Mypy type check
        entry: uv run --locked mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
